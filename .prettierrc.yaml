# Prettier configuration
# See: https://prettier.io/docs/en/options.html

tabWidth: 2
endOfLine: lf
printWidth: 100
semi: true
singleQuote: true
trailingComma: es5
bracketSameLine: true
quoteProps: as-needed
arrowParens: always

overrides:
  - files: ["*.md", "*.mdx"]
    options:
      parser: markdown
      proseWrap: preserve
      singleQuote: false

  - files: ["*.scss", "*.css"]
    options:
      parser: scss
      singleQuote: false

  - files: ["*.html", "*.hbs"]
    options:
      parser: html
      htmlWhitespaceSensitivity: css

  - files: ["*.json"]
    options:
      parser: json
      trailingComma: none

  - files: ["*.yaml", "*.yml"]
    options:
      parser: yaml
      tabWidth: 2
      singleQuote: false
